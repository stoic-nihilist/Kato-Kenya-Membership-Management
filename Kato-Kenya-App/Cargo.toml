[package]
name = "KatoKenyaMemberManagementService-App"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.34.2"
image = "0.25.10"
tokio = { version = "1.46", features = ["rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "2"