[package]
name = "Kato-Kenya-Server-App"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
bcrypt = "0.19.1"
rand = "0.9"
chrono = "0.4"

